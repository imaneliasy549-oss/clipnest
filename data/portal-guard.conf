# ClipNest portal guard - installed by `make install-portal-guard`.
#
# A portal backend that dies while the session is starting (the GTK one aborts
# with "cannot open display" when something calls it before WAYLAND_DISPLAY is
# exported) leaves every application waiting on 25-second D-Bus timeouts until
# systemd finally gives up on the unit minutes later. Retrying turns that stall
# into a sub-second restart, whoever caused it.
#
# Remove with `make uninstall-portal-guard`.
[Service]
Restart=on-failure
RestartSec=2
TimeoutStartSec=30
